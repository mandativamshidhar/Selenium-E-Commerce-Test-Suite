name: SauceDemo BDD Test Suite

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────
  # Smoke Tests — fast gate on every push
  # ─────────────────────────────────────────────
  smoke-tests:
    name: Smoke Tests (Chrome)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome
        run: |
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Run Smoke Tests
        run: |
          pytest -m smoke \
            --browser=chrome \
            --headless \
            --html=reports/smoke-report.html \
            --self-contained-html \
            -v
        continue-on-error: true

      - name: Upload Smoke Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-report
          path: |
            reports/
            screenshots/

  # ─────────────────────────────────────────────
  # Regression — Chrome
  # ─────────────────────────────────────────────
  regression-chrome:
    name: Regression (Chrome)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome
        run: |
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Run Regression Tests
        run: |
          pytest -m regression \
            --browser=chrome \
            --headless \
            --html=reports/regression-chrome.html \
            --self-contained-html \
            -v \
            --tb=short
        continue-on-error: true

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: regression-chrome
          path: |
            reports/
            screenshots/

  # ─────────────────────────────────────────────
  # Regression — Firefox
  # ─────────────────────────────────────────────
  regression-firefox:
    name: Regression (Firefox)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Firefox & GeckoDriver
        run: |
          sudo apt-get update -q
          sudo apt-get install -y firefox
          GECKO_VER=$(curl -s https://api.github.com/repos/mozilla/geckodriver/releases/latest | grep tag_name | cut -d '"' -f4)
          wget -q "https://github.com/mozilla/geckodriver/releases/download/${GECKO_VER}/geckodriver-${GECKO_VER}-linux64.tar.gz"
          tar -xzf geckodriver-*.tar.gz
          sudo mv geckodriver /usr/local/bin/
          geckodriver --version

      - name: Run Regression Tests
        run: |
          pytest -m regression \
            --browser=firefox \
            --headless \
            --html=reports/regression-firefox.html \
            --self-contained-html \
            -v \
            --tb=short
        continue-on-error: true
        env:
          DISPLAY: ""

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: regression-firefox
          path: |
            reports/
            screenshots/

  # ─────────────────────────────────────────────
  # Regression — Edge (Windows)
  # ─────────────────────────────────────────────
  regression-edge:
    name: Regression (Edge)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Regression Tests
        run: |
          pytest -m regression --browser=edge --headless --html=reports/regression-edge.html --self-contained-html -v --tb=short
        continue-on-error: true

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: regression-edge
          path: |
            reports/
            screenshots/

  # ─────────────────────────────────────────────
  # Summary
  # ─────────────────────────────────────────────
  publish-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [smoke-tests, regression-chrome, regression-firefox, regression-edge]
    if: always()

    steps:
      - name: Write Summary
        run: |
          echo "## SauceDemo BDD Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests (Chrome)    | ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Regression (Chrome)     | ${{ needs.regression-chrome.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Regression (Firefox)    | ${{ needs.regression-firefox.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Regression (Edge)       | ${{ needs.regression-edge.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "HTML reports and screenshots available in workflow artifacts." >> $GITHUB_STEP_SUMMARY
