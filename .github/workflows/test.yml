name: SauceDemo BDD Test Suite

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      browser:
        description: "Browser to run tests on"
        required: true
        default: "chrome"
        type: choice
        options: [chrome, firefox, edge]
      tags:
        description: "Pytest markers to filter (e.g. smoke, regression)"
        required: false
        default: ""

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ─────────────────────────────────────────────
  # Smoke Tests — fast gate on every push
  # ─────────────────────────────────────────────
  smoke-tests:
    name: 🚀 Smoke Tests (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Smoke Tests
        run: |
          pytest -m smoke \
            --browser=chrome \
            --headless \
            --html=reports/smoke-report.html \
            --self-contained-html \
            -v
        continue-on-error: false

      - name: Upload Smoke Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            reports/smoke-report.html
            screenshots/

  # ─────────────────────────────────────────────
  # Cross-Browser Regression Matrix
  # ─────────────────────────────────────────────
  regression-tests:
    name: 🧪 Regression — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    needs: smoke-tests
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]   # Edge omitted on ubuntu-latest (no native support)
        include:
          - browser: chrome
            setup-action: browser-actions/setup-chrome@v1
          - browser: firefox
            setup-action: browser-actions/setup-firefox@v1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up ${{ matrix.browser }}
        uses: ${{ matrix.setup-action }}

      - name: Run Regression Tests — ${{ matrix.browser }}
        run: |
          pytest -m regression \
            --browser=${{ matrix.browser }} \
            --headless \
            --html=reports/regression-${{ matrix.browser }}.html \
            --self-contained-html \
            -v \
            --tb=long
        continue-on-error: true

      - name: Upload Regression Report — ${{ matrix.browser }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.browser }}
          path: |
            reports/regression-${{ matrix.browser }}.html
            screenshots/

  # ─────────────────────────────────────────────
  # Edge regression (Windows runner)
  # ─────────────────────────────────────────────
  regression-edge:
    name: 🧪 Regression — Edge (Windows)
    runs-on: windows-latest
    needs: smoke-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Regression Tests — Edge
        run: |
          pytest -m regression `
            --browser=edge `
            --headless `
            --html=reports/regression-edge.html `
            --self-contained-html `
            -v `
            --tb=long
        continue-on-error: true

      - name: Upload Edge Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-edge
          path: |
            reports/regression-edge.html
            screenshots/

  # ─────────────────────────────────────────────
  # Merge & publish test summary
  # ─────────────────────────────────────────────
  publish-summary:
    name: 📊 Publish Test Summary
    runs-on: ubuntu-latest
    needs: [smoke-tests, regression-tests, regression-edge]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports/

      - name: Generate Summary
        run: |
          echo "## 🧪 SauceDemo BDD Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests (Chrome) | ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Regression (Chrome)  | ${{ needs.regression-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Regression (Firefox) | ${{ needs.regression-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Regression (Edge)    | ${{ needs.regression-edge.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📸 Screenshots and HTML reports available in workflow artifacts." >> $GITHUB_STEP_SUMMARY

      - name: Upload Combined Reports
        uses: actions/upload-artifact@v4
        with:
          name: all-test-reports
          path: all-reports/
          retention-days: 30
