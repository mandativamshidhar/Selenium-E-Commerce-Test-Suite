[pytest]
addopts =
    -v
    --self-contained-html
    --tb=short
    --strict-markers

markers =
    smoke: Quick sanity-check tests
    regression: Full regression suite
    login: Login feature tests
    inventory: Inventory feature tests
    cart: Cart feature tests
    checkout: Checkout feature tests
    cross_browser: Run across multiple browsers

testpaths = tests/step_defs

bdd_features_base_dir = tests/features
